<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AstroGuide</title>
  <link rel="stylesheet" href="1.css">
</head>
<body>
<!-- i am amit king -->
<div class="container">
  <h1>🔮 AstroGuide</h1>
  <p class="tagline">Discover Your Destiny</p>

  <form id="astroForm">
    <input type="text" placeholder="First Name" id="fname" required>
    <input type="text" placeholder="Surname" id="lname" required>

    <div class="dob">
      <input type="number" placeholder="Date" id="date" min="1" max="31" required>
      <input type="number" placeholder="Month" id="month" min="1" max="12" required>
      <input type="number" placeholder="Year" id="year" required>
    </div>

    <button type="submit">Check Horoscope</button>
  </form>

  <div id="result" class="result"></div>
</div>

<script src="1.js"></script>
</body>
</html>
